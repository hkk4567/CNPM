<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Menu điều hướng</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a:focus-visible,button:focus-visible{outline:2px solid #1B6B63;outline-offset:2px}
</style>
</helmet>
<nav aria-label="Menu chính" style="box-sizing: border-box; width: 100%; max-width: 264px; min-height: 900px; display: flex; flex-direction: column; gap: 24px; padding: 24px 16px; background: #FFFFFF; border-right: 1px solid #DDE4E2; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #1A2B2A">

<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1B6B63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h12v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8z"/><path d="M16 10h2a2 2 0 0 1 0 4h-2"/><path d="M7 3v2"/><path d="M11 3v2"/></svg>
<span style="font-size: 17px; font-weight: 700">Quản lý quán</span>
</div>

<div style="display: flex; flex-direction: column; gap: 20px; flex-grow: 1">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="padding: 0 12px 4px; font-size: 13px; font-weight: 600; color: #5B6B69">{{g.ten}}</div>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
<a href="{{it.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; font-size: 15px; text-decoration: none; background: {{it.bg}}; color: {{it.fg}}; font-weight: {{it.fw}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"/></svg>
<span style="flex-grow: 1">{{it.label}}</span>
</a>
</sc-for>
</div>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; padding-top: 16px; border-top: 1px solid #DDE4E2">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 8px">
<div style="width: 40px; height: 40px; border-radius: 999px; background: #E3F0EE; color: #14524C; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">{{vienChu}}</div>
<div style="display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 14px; font-weight: 600">{{ten}}</span>
<span style="font-size: 13px; color: #5B6B69">{{vaiTro}}</span>
</div>
</div>
<div style="display: flex; gap: 8px; padding: 0 4px">
<button type="button" style="flex-grow: 1; min-height: 44px; font-family: inherit; font-size: 14px; font-weight: 500; color: #1A2B2A; background: #FFFFFF; border: 1px solid #B9C6C3; border-radius: 10px; cursor: pointer">Đổi mật khẩu</button>
<button type="button" style="min-height: 44px; padding: 0 14px; font-family: inherit; font-size: 14px; font-weight: 500; color: #1A2B2A; background: #FFFFFF; border: 1px solid #B9C6C3; border-radius: 10px; cursor: pointer">Đăng xuất</button>
</div>
</div>

</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["admin","quan_ly"],"default":"quan_ly"},"active":{"editor":"text","default":"san-pham"},"$preview":{"width":264,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const role = this.props.role ?? 'quan_ly';
const active = this.props.active ?? 'san-pham';
const admin = role === 'admin';
const all = [
{ ten: 'Thực đơn', items: [
{ k: 'san-pham', label: 'Sản phẩm', href: 'SanPham.dc.html', d: 'M4 8h12v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8z M16 10h2a2 2 0 0 1 0 4h-2 M7 3v2 M11 3v2' },
{ k: 'khuyen-mai', label: 'Khuyến mãi', href: '#', d: 'M3 12V4h8l9 9-8 8-9-9z M7.5 8.5h.01' } ] },
{ ten: 'Kho', items: [
{ k: 'ton-kho', label: 'Tồn kho', href: 'Kho.dc.html', d: 'M3 7l9-4 9 4v10l-9 4-9-4V7z M3 7l9 4 9-4 M12 11v10' },
{ k: 'nhap-hang', label: 'Nhập hàng', href: '#', d: 'M12 3v12 M7 10l5 5 5-5 M4 20h16' } ] },
{ ten: 'Khách hàng', items: [
{ k: 'khach-hang', label: 'Khách hàng', href: '#', d: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 21a8 8 0 0 1 16 0' } ] },
{ ten: 'Nhân sự', items: [
{ k: 'lich', label: 'Lịch làm việc', href: '#', d: 'M4 6h16v14H4z M4 10h16 M8 3v4 M16 3v4' },
{ k: 'nhan-vien', label: 'Nhân viên', href: '#', d: 'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z M2 20a7 7 0 0 1 14 0 M17 4.5a3.5 3.5 0 0 1 0 6.5 M19 14a7 7 0 0 1 3 6' } ].concat(admin ? [
{ k: 'tai-khoan', label: 'Tài khoản và quyền', href: '#', d: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z' } ] : []) },
{ ten: 'Báo cáo', items: [
{ k: 'bao-cao', label: 'Báo cáo', href: 'BaoCao.dc.html', d: 'M4 20V10 M10 20V4 M16 20v-7 M22 20H2' } ] }
];
const groups = all.map((g) => ({
ten: g.ten,
items: g.items.map((i) => ({
label: i.label, href: i.href, d: i.d,
bg: i.k === active ? '#E3F0EE' : 'transparent',
fg: i.k === active ? '#14524C' : '#2B3B39',
fw: i.k === active ? 600 : 500
}))
}));
return {
groups,
ten: admin ? 'Nguyễn Văn Quản Trị' : 'Trần Thị Quản Lý',
vaiTro: admin ? 'Admin' : 'Quản lý',
vienChu: admin ? 'QT' : 'QL'
};
}
}
</script>
</body>
</html>
